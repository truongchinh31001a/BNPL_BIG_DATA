x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  HF_DATASET_IDS: ${HF_DATASET_IDS}
  BNPL_SOURCE_DATASET_ID: ${BNPL_SOURCE_DATASET_ID}
  HF_DATASET_SPLIT: ${HF_DATASET_SPLIT}
  INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE}
  INGEST_MAX_ROWS: ${INGEST_MAX_ROWS}
  HDFS_URI: ${HDFS_URI:-hdfs://namenode:8020}
  HDFS_BASE_PATH: ${HDFS_BASE_PATH:-/bnpl-data}
  HDFS_REPLICATION: ${HDFS_REPLICATION:-3}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC}
  PIPELINE_REGISTRY_ENABLED: ${PIPELINE_REGISTRY_ENABLED:-true}

x-spark-environment: &spark-environment
  HDFS_URI: ${HDFS_URI:-hdfs://namenode:8020}
  HDFS_BASE_PATH: ${HDFS_BASE_PATH:-/bnpl-data}
  HDFS_REPLICATION: ${HDFS_REPLICATION:-3}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC}

services:
  postgres:
    image: postgres:16
    container_name: bnpl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bnpl-network]

  postgres-schema-init:
    image: postgres:16
    container_name: bnpl-postgres-schema-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql:/sql:ro
    entrypoint: >
      /bin/sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/init.sql &&
      psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/analytics_schema.sql &&
      psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/ml_schema.sql &&
      psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/batch_registry.sql &&
      psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /sql/data_quality_schema.sql"
    networks: [bnpl-network]

  hdfs-volume-init:
    image: apache/hadoop:3.3.6
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /data/name /data/data-1 /data/data-2 /data/data-3 && chown -R 1000:100 /data/name /data/data-1 /data/data-2 /data/data-3"]
    volumes:
      - hdfs_namenode:/data/name
      - hdfs_datanode:/data/data-1
      - hdfs_datanode_2:/data/data-2
      - hdfs_datanode_3:/data/data-3
    restart: "no"
    networks: [bnpl-network]

  hdfs-format:
    image: apache/hadoop:3.3.6
    depends_on:
      hdfs-volume-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ ! -f /data/name/current/VERSION ]; then
          hdfs namenode -format -force -nonInteractive;
        fi
    volumes:
      - hdfs_namenode:/data/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    restart: "no"
    networks: [bnpl-network]

  namenode:
    image: apache/hadoop:3.3.6
    container_name: bnpl-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    depends_on:
      hdfs-format:
        condition: service_completed_successfully
    environment:
      ENSURE_NAMENODE_DIR: /data/name
    ports:
      - "${HDFS_NAMENODE_UI_PORT:-9870}:9870"
      - "8020:8020"
    volumes:
      - hdfs_namenode:/data/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [bnpl-network]

  datanode-1:
    image: apache/hadoop:3.3.6
    container_name: bnpl-datanode-1
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports: ["${HDFS_DATANODE_1_UI_PORT:-9864}:9864"]
    volumes:
      - hdfs_datanode:/data/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (3)'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [bnpl-network]

  datanode-2:
    image: apache/hadoop:3.3.6
    container_name: bnpl-datanode-2
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports: ["${HDFS_DATANODE_2_UI_PORT:-9865}:9864"]
    volumes:
      - hdfs_datanode_2:/data/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (3)'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [bnpl-network]

  datanode-3:
    image: apache/hadoop:3.3.6
    container_name: bnpl-datanode-3
    hostname: datanode-3
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports: ["${HDFS_DATANODE_3_UI_PORT:-9866}:9864"]
    volumes:
      - hdfs_datanode_3:/data/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (3)'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    networks: [bnpl-network]

  hdfs-init:
    image: apache/hadoop:3.3.6
    container_name: bnpl-hdfs-init
    depends_on:
      datanode-1:
        condition: service_healthy
      datanode-2:
        condition: service_healthy
      datanode-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        hdfs dfs -mkdir -p ${HDFS_BASE_PATH:-/bnpl-data} &&
        hdfs dfs -chmod 777 ${HDFS_BASE_PATH:-/bnpl-data}
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    restart: "no"
    networks: [bnpl-network]

  kafka-volume-init:
    image: apache/kafka:3.9.1
    profiles: [streaming, inference]
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "1000:1000", "/kafka-data"]
    volumes: ["kafka_data:/kafka-data"]
    networks: [bnpl-network]

  kafka:
    image: apache/kafka:3.9.1
    container_name: bnpl-kafka
    profiles: [streaming, inference]
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports: ["19092:19092"]
    volumes: ["kafka_data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [bnpl-network]

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: bnpl-kafka-init
    profiles: [streaming, inference]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "${KAFKA_TOPIC}", "--partitions", "1", "--replication-factor", "1"]
    networks: [bnpl-network]

  fake-bnpl-producer:
    build: ./kafka/producer
    image: bnpl-fake-producer:latest
    container_name: bnpl-fake-producer
    profiles: [streaming]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      FAKE_EVENTS_PER_SECOND: ${FAKE_EVENTS_PER_SECOND:-2}
      FAKE_INVALID_RATE: ${FAKE_INVALID_RATE:-0.02}
      FAKE_RANDOM_SEED: ${FAKE_RANDOM_SEED:-42}
    restart: unless-stopped
    networks: [bnpl-network]

  spark-master:
    build: ./spark
    image: bnpl-spark:3.5.1
    container_name: spark-master
    environment:
      <<: *spark-environment
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports: ["7077:7077", "8080:8080"]
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/bitnami/spark/app:ro
      - ./spark/conf/metrics.properties:/opt/bitnami/spark/conf/metrics.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/$$(hostname)/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bnpl-network]

  spark-worker:
    image: bnpl-spark:3.5.1
    environment:
      <<: *spark-environment
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_OPTS: >-
        -Dspark.worker.cleanup.enabled=true
        -Dspark.worker.cleanup.interval=60
        -Dspark.worker.cleanup.appDataTtl=300
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark:/opt/bitnami/spark/app:ro
      - ./spark/conf/metrics.properties:/opt/bitnami/spark/conf/metrics.properties:ro
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-2}
    networks: [bnpl-network]

  spark-ivy-init:
    image: bnpl-spark:3.5.1
    profiles: [streaming, inference]
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /opt/bitnami/spark/.ivy2/cache /opt/bitnami/spark/.ivy2/jars && chown -R 1001:0 /opt/bitnami/spark/.ivy2"]
    volumes:
      - spark_ivy_cache:/opt/bitnami/spark/.ivy2
    restart: "no"
    networks: [bnpl-network]

  spark-streaming-job:
    image: bnpl-spark:3.5.1
    container_name: bnpl-spark-streaming
    profiles: [streaming, inference]
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.cores=1
      - --packages
      - io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - /opt/bitnami/spark/app/jobs/streaming_kafka_to_bronze.py
    environment: *spark-environment
    depends_on:
      spark-master:
        condition: service_healthy
      spark-ivy-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/bitnami/spark/app:ro
      - spark_ivy_cache:/opt/bitnami/spark/.ivy2
    restart: unless-stopped
    networks: [bnpl-network]

  spark-streaming-prediction:
    image: bnpl-spark:3.5.1
    container_name: bnpl-spark-streaming-prediction
    profiles: [inference]
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.cores=1
      - --packages
      - io.delta:delta-spark_2.12:3.2.0
      - /opt/bitnami/spark/app/jobs/streaming_predict.py
    environment: *spark-environment
    depends_on:
      postgres-schema-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-streaming-job:
        condition: service_started
      spark-ivy-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    volumes:
      - ./spark:/opt/bitnami/spark/app:ro
      - spark_ivy_cache:/opt/bitnami/spark/.ivy2
    restart: unless-stopped
    networks: [bnpl-network]

  airflow-init:
    build: ./airflow
    image: bnpl-airflow-spark:2.9.2
    container_name: bnpl-airflow-init
    command: version
    depends_on:
      postgres-schema-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "${AIRFLOW_UID}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/airflow/spark:ro
    networks: [bnpl-network]

  airflow-webserver:
    image: bnpl-airflow-spark:2.9.2
    container_name: bnpl-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    environment: *airflow-environment
    user: "${AIRFLOW_UID}:0"
    ports: ["8088:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/airflow/spark:ro
    restart: unless-stopped
    networks: [bnpl-network]

  airflow-scheduler:
    image: bnpl-airflow-spark:2.9.2
    container_name: bnpl-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    command: scheduler
    environment: *airflow-environment
    user: "${AIRFLOW_UID}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/airflow/spark:ro
    restart: unless-stopped
    networks: [bnpl-network]

  demo-dashboard:
    build: ./dashboard/streamlit
    image: bnpl-demo-dashboard:latest
    container_name: bnpl-demo-dashboard
    profiles: [demo]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-schema-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HDFS_JMX_URL: http://namenode:9870/jmx
      SPARK_MASTER_HTTP_URL: http://spark-master:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
    ports: ["${STREAMLIT_PORT:-8501}:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [bnpl-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bnpl-prometheus
    profiles: [monitoring]
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [bnpl-network]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: bnpl-grafana
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_DISABLE_PLUGINS: xychart
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks: [bnpl-network]

volumes:
  postgres_data:
  hdfs_namenode:
  hdfs_datanode:
  hdfs_datanode_2:
  hdfs_datanode_3:
  kafka_data:
  spark_ivy_cache:
  prometheus_data:
  grafana_data:

networks:
  bnpl-network:
    name: bnpl-network
